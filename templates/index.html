<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wayanad Flood Prediction</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 30px auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; color: #333; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
        .field { margin-bottom: 15px; }
        .field label {
            display: block; font-size: 13px; color: #555;
            margin-bottom: 5px; font-weight: 600;
        }
        .field input {
            width: 100%; padding: 10px;
            border: 2px solid #e0e0e0; border-radius: 8px;
            font-size: 14px;
        }
        .field input:focus { outline: none; border-color: #667eea; }
        button {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 10px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            margin-top: 20px;
        }
        button:disabled { opacity: 0.6; }
        .result {
            margin-top: 30px; padding: 25px;
            border-radius: 15px; text-align: center; display: none;
        }
        .result.show { display: block; }
        .result.flood { background: #ffe5e5; border: 2px solid #e74c3c; }
        .result.safe { background: #e5ffe5; border: 2px solid #27ae60; }
        .result h2 { font-size: 28px; margin-bottom: 10px; }
        .result.flood h2 { color: #e74c3c; }
        .result.safe h2 { color: #27ae60; }
        .prob-bar { height: 20px; background: #eee; border-radius: 10px; overflow: hidden; margin: 15px 0; }
        .prob-fill { height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌊 Wayanad Flood Prediction</h1>
        <p class="subtitle">Enter rainfall parameters to predict flood risk</p>
        {% for f in features_info %}
        <div class="field">
            <label>{{ f.label }}</label>
            <input type="number" step="any" id="{{ f.name }}" value="{{ f.default }}">
        </div>
        {% endfor %}
        <button onclick="predict()" id="predictBtn">Predict Flood Risk</button>
        <div class="result" id="result"></div>
    </div>
    <script>
        async function predict() {
            const btn = document.getElementById('predictBtn');
            const resultDiv = document.getElementById('result');
            btn.disabled = true;
            btn.innerText = 'Predicting...';
            const features = {{ features_info | map(attribute='name') | list | tojson }};
            const data = {};
            for (const f of features) data[f] = document.getElementById(f).value;
            const response = await fetch('/predict', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const result = await response.json();
            const isFlood = result.prediction === 'FLOOD';
            resultDiv.className = 'result show ' + (isFlood ? 'flood' : 'safe');
            resultDiv.innerHTML = `
                <h2>${isFlood ? '🌊 FLOOD PREDICTED' : '☀️ NO FLOOD'}</h2>
                <p><strong>Risk Level:</strong> ${result.risk_level}</p>
                <div class="prob-bar">
                    <div class="prob-fill" style="width: ${result.flood_probability}%; background: ${isFlood ? '#e74c3c' : '#27ae60'};"></div>
                </div>
                <p><strong>Flood Probability:</strong> ${result.flood_probability}%</p>
            `;
            btn.disabled = false;
            btn.innerText = 'Predict Flood Risk';
        }
    </script>
</body>
</html>
